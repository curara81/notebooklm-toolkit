# XcodeGen 프로젝트 정의
# 사용법:
#   brew install xcodegen
#   cd apple-watch-app
#   xcodegen generate
#   open MeetingRecorder.xcodeproj
#
# 번들 ID(com.example.*)는 본인 Apple 개발자 계정 ID로 바꾸세요.

name: MeetingRecorder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # 본인 팀 ID 입력 (Xcode Signing에서도 설정 가능)
    CODE_SIGN_STYLE: Automatic

targets:
  # ---------------- iPhone 앱 ----------------
  MeetingRecorder:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.meetingrecorder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "회의 녹음을 위해 마이크를 사용합니다."
        INFOPLIST_KEY_UIBackgroundModes: audio   # 녹음 중 백그라운드 유지
    dependencies:
      - target: MeetingRecorderWatch

  # ---------------- Apple Watch 앱 ----------------
  MeetingRecorderWatch:
    type: application
    platform: watchOS
    sources:
      - Shared
      - Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.meetingrecorder.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.meetingrecorder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
